providers:
  kubernetesCRD:
    enabled: false
  kubernetesIngress:
    enabled: true
  kubernetesGateway:
    enabled: true
gateway:
  enabled: false
gatewayClass:
  enabled: false
ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik
ports:
  web:
    port: 80
service:
  spec:
    type: ClusterIP
global:
  checkNewVersion: false
  sendAnonymousUsage: false
api:
  dashboard: false
securityContext:
  capabilities:
    drop: [ALL]
    add: [NET_BIND_SERVICE]
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
