name: Validate YAML

on:
  push:
    branches: [main]
    paths:
      - 'skeletons/**'
      - 'exercises/**'
      - 'lab/**'
      - 'scripts/lab.sh'
      - 'scripts/check-lab.sh'
      - 'scripts/exam-setup.sh'
      - '**.yaml'
      - '**.yml'
  pull_request:
    branches: [main]
    paths:
      - 'skeletons/**'
      - 'exercises/**'
      - 'lab/**'
      - 'scripts/lab.sh'
      - 'scripts/check-lab.sh'
      - 'scripts/exam-setup.sh'
      - '**.yaml'
      - '**.yml'

jobs:
  lab-tests:
    name: Lab configuration and CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install -r lab/requirements-dev.txt
      - name: Check shell syntax
        run: |
          for script in scripts/lab.sh scripts/check-lab.sh scripts/exam-setup.sh lab/bashrc; do
            bash -n "$script"
          done
      - name: Test lab configuration and isolation
        run: python -m unittest discover -s lab/tests -v

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint skeleton YAML files
        run: |
          yamllint -d '{extends: default, rules: {line-length: {max: 200}, truthy: disable, document-start: disable, comments-indentation: disable, indentation: {indent-sequences: whatever}, new-lines: {type: platform}}}' skeletons/

      - name: Validate YAML syntax (kubectl dry-run)
        run: |
          echo "--- Checking YAML syntax ---"
          errors=0
          for f in skeletons/*.yaml; do
            if ! python3 -c "import yaml, sys; yaml.safe_load_all(open('$f'))" 2>/dev/null; then
              echo "INVALID: $f"
              errors=$((errors + 1))
            else
              echo "OK: $f"
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "$errors file(s) failed validation"
            exit 1
          fi
          echo "All YAML files valid"
